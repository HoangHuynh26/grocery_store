# ==============================================================================
# NETLIFY DEPLOYMENT CONFIGURATION FOR GROCERY STORE POS FRONTEND
# ==============================================================================

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  VITE_API_URL = "https://grocery-store-ss76.onrender.com/api"
  VITE_SOCKET_URL = "https://grocery-store-ss76.onrender.com"
  VITE_PUBLIC_BACKEND_URL = "https://grocery-store-ss76.onrender.com"
  VITE_PUBLIC_FRONTEND_URL = "https://taphoasonhien.netlify.app"

# SPA Fallback: Chuyển hướng toàn bộ các route (/pos, /invoices, /orders, /ai-assistant) về /index.html với HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Tối ưu hóa bộ nhớ đệm (Cache-Control) cho các tài nguyên tĩnh đã băm tên (hashed assets)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Header bảo mật cơ bản
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Render Blueprint Specification for Grocery Store POS System
# Deploy Backend Web Service + Managed PostgreSQL on Render

databases:
  - name: grocery-pos-db
    databaseName: grocery_store
    user: grocery_user
    plan: free
    region: singapore

services:
  - type: web
    name: grocery-pos-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: grocery-pos-db
          property: connectionString

# Render Blueprint Specification for Grocery Store POS System
# Backend Web Service connected to Neon Serverless PostgreSQL (neon.tech)

services:
  - type: web
    name: grocery-pos-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Nhập chuỗi kết nối Neon PostgreSQL của bạn tại đây: postgresql://user:pass@ep-xyz.neon.tech/neondb?sslmode=require
      - key: CLIENT_URL
        sync: false # URL Frontend Vercel của bạn (ví dụ: https://ten-ung-dung.vercel.app)
      - key: CORS_ORIGIN
        sync: false # Tùy chọn: URL Frontend CORS (ví dụ: https://ten-ung-dung.vercel.app)
      - key: GEMINI_API_KEY
        sync: false # Tùy chọn: Google Gemini API Key để kích hoạt AI Assistant & AI Vision

